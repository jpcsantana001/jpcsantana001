<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="280" rx="20" fill="#0D1117"/>

  <!-- GRID -->
  <g opacity="0.08">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200"
          stroke="#00E5FF"/>
    <path d="M80 0V280M160 0V280M240 0V280M320 0V280M400 0V280M480 0V280M560 0V280M640 0V280M720 0V280M800 0V280M880 0V280M960 0V280M1040 0V280M1120 0V280"
          stroke="#00E5FF"/>
  </g>

  <!-- LEFT CIRCUITS -->
  <g stroke="#00E5FF" stroke-width="2" opacity="0.5">
    <path d="M0 70H90L120 100H220">
      <animate attributeName="stroke-dasharray"
               values="0 300;80 300;0 300"
               dur="4s"
               repeatCount="indefinite"/>
    </path>

    <path d="M0 210H120L150 180H230">
      <animate attributeName="stroke-dasharray"
               values="0 300;90 300;0 300"
               dur="5s"
               repeatCount="indefinite"/>
    </path>
  </g>

  <!-- RIGHT CIRCUITS -->
  <g stroke="#7C4DFF" stroke-width="2" opacity="0.5">
    <path d="M1200 70H1110L1080 100H980">
      <animate attributeName="stroke-dasharray"
               values="0 300;80 300;0 300"
               dur="4.5s"
               repeatCount="indefinite"/>
    </path>

    <path d="M1200 210H1080L1050 180H970">
      <animate attributeName="stroke-dasharray"
               values="0 300;100 300;0 300"
               dur="5.5s"
               repeatCount="indefinite"/>
    </path>
  </g>

  <!-- TOP LABEL -->
  <text x="50" y="45"
        fill="#00E5FF"
        font-family="monospace"
        font-size="18">
    SYSTEM_INITIALIZATION.EXE
  </text>

  <!-- ONLINE -->
  <circle cx="1115" cy="40" r="7" fill="#00FF88">
    <animate attributeName="opacity"
             values="1;0.25;1"
             dur="1.4s"
             repeatCount="indefinite"/>
  </circle>

  <text x="1130" y="46"
        fill="#00FF88"
        font-family="monospace"
        font-size="17">
    ONLINE
  </text>

  <!-- TERMINAL ICON -->
  <g transform="translate(90,90)" filter="url(#glow)">
    <rect width="115" height="95" rx="16"
          stroke="#00E5FF"
          stroke-width="4"
          fill="#111827"/>

    <path d="M30 28L50 47L30 66"
          stroke="#00E5FF"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M62 67H88"
          stroke="#7C4DFF"
          stroke-width="6"
          stroke-linecap="round"/>
  </g>

  <!-- MAIN TITLE -->
  <text x="600" y="118"
        text-anchor="middle"
        fill="url(#titleGradient)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="3"
        filter="url(#glow)">
    JOÃO PEDRO SANTANA

    <animate attributeName="opacity"
             values="0;1;1"
             dur="2s"
             repeatCount="1"/>
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="160"
        text-anchor="middle"
        fill="#D1D5DB"
        font-family="monospace"
        font-size="21"
        letter-spacing="3">
    SOFTWARE ENGINEERING • FULL STACK DEVELOPER
  </text>

  <!-- TAGLINE -->
  <text x="600" y="198"
        text-anchor="middle"
        fill="#00E5FF"
        font-family="monospace"
        font-size="18">
    BUILDING REAL SYSTEMS THAT SOLVE REAL PROBLEMS

    <animate attributeName="opacity"
             values="0.25;1;0.25"
             dur="3s"
             repeatCount="indefinite"/>
  </text>

  <!-- MOVING LINE -->
  <rect x="320" y="225" width="560" height="3" rx="2"
        fill="url(#lineGradient)">

    <animate attributeName="x"
             values="150;490;150"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="width"
             values="300;560;300"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>

  <!-- STATUS -->
  <text x="600" y="255"
        text-anchor="middle"
        fill="#9CA3AF"
        font-family="monospace"
        font-size="16">

    CODE • BUILD • DEPLOY • IMPROVE

  </text>

</svg>
